name: Build images

# Tagging the repository builds both images and publishes them as one GitHub
# release:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
#   * LiteAI-<version>-x86_64.iso         - PCs (UEFI x64/ia32 and legacy BIOS)
#   * LiteAI-<version>-aarch64-rpi.img.xz - 64-bit Raspberry Pi boards
#
# The workflow can also be run by hand from the Actions tab, which uploads the
# images as build artifacts without touching releases.
#
# The baked model pushes both artifacts past GitHub's 2 GiB release-asset
# limit, so release builds attach the checksums and package manifests and
# upload the images themselves as workflow artifacts (downloadable from the
# run page for 14 days; raise retention or mirror them externally as needed).
#
# Pull requests run the `mcp` job and nothing else. It takes a couple of
# minutes and is the only part of a build that can fail on a code mistake
# rather than on a mirror or a runner; the image jobs are two-hour builds
# that produce gigabyte artifacts, and gating every PR on those would buy
# very little.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which images to build'
        type: choice
        options: [both, x86_64, raspberrypi]
        default: both
      pi_version:
        description: 'pi version to bundle ("pinned" uses the version in scripts/fetch-pi.sh)'
        required: false
        default: 'pinned'

permissions:
  contents: write

concurrency:
  group: build-images-${{ github.ref }}
  # A superseded PR check is wasted minutes, but a release build must never be
  # cancelled out from under a tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    # Nothing a pull request runs needs a version, and a check that only ever
    # echoes one is noise on the PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pi_version: ${{ steps.v.outputs.pi_version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date +%Y.%m.%d)-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.pi_version || 'pinned' }}" == "pinned" ]]; then
            echo "pi_version=" >> "$GITHUB_OUTPUT"   # empty: fetch-pi.sh uses its pin
          else
            echo "pi_version=${{ github.event.inputs.pi_version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building LiteAI ${version}"

  # The MCP server is architecture-neutral JavaScript, so it is built and tested
  # once and both image jobs consume the same artifact. Building it inside each
  # image job would mean two Node toolchains - pacman's in an Arch container,
  # and setup-node's on an arm64 Ubuntu runner - producing the same bytes twice.
  mcp:
    name: Build LiteAI MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci --prefix mcp --no-audit --no-fund

      - name: Typecheck
        run: npm run --prefix mcp typecheck

      - name: Test
        run: npm test --prefix mcp

      - name: Build
        run: ./scripts/build-mcp.sh -o out/mcp

      - uses: actions/upload-artifact@v7
        with:
          name: liteai-mcp-server
          path: out/mcp
          retention-days: 14

  x86_64:
    name: x86-64 ISO
    needs: [version, mcp]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || contains(fromJSON('["both","x86_64"]'), github.event.inputs.targets))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt MCP server
        uses: actions/download-artifact@v8
        with:
          name: liteai-mcp-server
          path: mcp-dist

      - name: Cache the baked model
        uses: actions/cache@v4
        with:
          # Keyed on the pinned file name; bump the key when fetch-model.sh's
          # model changes. The cache lives on the roomy system drive.
          path: model-cache
          key: liteai-model-${{ hashFiles('scripts/fetch-model.sh') }}-v1

      - name: Free up disk space
        run: |
          echo "before:"; df -h / /mnt | tail -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          # The build tree (pacstrap root + squashfs) goes on /mnt, the roomy
          # ephemeral disk; only the finished ISO lands on /.
          sudo mkdir -p /mnt/liteai-work
          sudo chmod 0777 /mnt/liteai-work
          echo "after:"; df -h / /mnt | tail -2

      - name: Build the ISO
        # mkarchiso builds a chroot and mounts API filesystems inside it, which
        # a plain `container:` job cannot do - hence a privileged container
        # started by hand.
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PI_VERSION: ${{ needs.version.outputs.pi_version }}
        run: |
          # Only point the build at the cached model when it is actually there;
          # fetch-model.sh refuses a configured-but-missing source, and a cold
          # cache must mean a download, not a failed run.
          model_env=()
          if [[ -f model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf ]]; then
            echo "using the cached model"
            model_env=(-e LITEAI_MODEL_SRC=/build/model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf)
          fi
          # --pull always: the runner may already hold an archlinux:latest layer
          # from its image cache, and pacstrap installs from whatever package
          # databases this container syncs - so a stale base means a stale ISO.
          docker run --rm --privileged --pull always \
            -v "${PWD}:/build" \
            -v /mnt/liteai-work:/work \
            -w /build \
            -e ISO_VERSION="${BUILD_VERSION}" \
            -e LITEAI_PI_VERSION="${PI_VERSION}" \
            -e LITEAI_MCP_PREBUILT=/build/mcp-dist \
            "${model_env[@]}" \
            archlinux:latest \
            bash -euo pipefail -c '
              # The keyring goes first and on its own: a base image older than
              # the current signing keys cannot verify the upgrade that follows.
              pacman -Sy --noconfirm --needed archlinux-keyring
              # A full upgrade, not just -S: mkarchiso pacstraps from the
              # databases this container syncs, so refreshing them here is what
              # puts current package versions into the image. grub is only an
              # optional dependency of archiso, but mkarchiso needs
              # grub-mkstandalone to build the UEFI boot modes.
              pacman -Syu --noconfirm --needed archiso git grub nodejs npm
              git config --global --add safe.directory /build
              ./scripts/build-iso.sh -v "${ISO_VERSION}" -w /work -o /build/out
            '

      - name: Keep a copy of the model for the cache
        if: always()
        run: |
          # The staged model came out of the cache (or the network once); leave
          # a copy where the cache step above can pick it up next run. The work
          # volume is a host path (/mnt/liteai-work), root-owned by the docker
          # build.
          src=$(sudo find /mnt/liteai-work/profile/airootfs/var/lib/liteai/models \
                     -name '*.gguf' 2>/dev/null | head -1 || true)
          if [ -n "$src" ]; then
            mkdir -p model-cache
            sudo cp "$src" model-cache/
            sudo chown -R "$(id -u):$(id -g)" model-cache
          fi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### x86-64 ISO"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.iso; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            # Arch is a rolling release, so what shipped is decided by the
            # mirrors at build time - print it rather than leave it to trust.
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The baked model puts the ISO past GitHub's 2 GiB release-asset limit on
      # purpose. Nothing fails: the image travels as a workflow artifact and the
      # release notes point at it (see the release job).
      # The image travels as a workflow artifact (past the 2 GiB release-asset
      # limit by design); the checksum and manifest go in a separate, small
      # metadata artifact that the release job can attach to the release.
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64
          path: out/*.iso
          retention-days: 14
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64-metadata
          path: |
            out/*.sha256
            out/*.packages.txt
          retention-days: 14

  raspberrypi:
    name: Raspberry Pi image
    needs: [version, mcp]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || contains(fromJSON('["both","raspberrypi"]'), github.event.inputs.targets))
    # A native aarch64 runner means the build can chroot into the image
    # directly instead of emulating every command through qemu.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt MCP server
        uses: actions/download-artifact@v8
        with:
          name: liteai-mcp-server
          path: mcp-dist

      - name: Cache the baked model
        uses: actions/cache@v4
        with:
          path: model-cache
          key: liteai-model-${{ hashFiles('scripts/fetch-model.sh') }}-v1

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libarchive-tools dosfstools e2fsprogs xz-utils util-linux curl
          echo "before:"; df -h / | tail -1

      - name: Build the image
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PI_VERSION: ${{ needs.version.outputs.pi_version }}
          LITEAI_MCP_PREBUILT: ${{ github.workspace }}/mcp-dist
        run: sudo -E ./rpi/build-image.sh -v "${BUILD_VERSION}" -o "${PWD}/out" -w /mnt/liteai-rpi

      - name: Keep a copy of the model for the cache
        if: always()
        run: |
          # The image build (-w /mnt/liteai-rpi) leaves its staged rootfs root-
          # owned; copy the model out with sudo so the cache step can keep it.
          src=$(sudo find /mnt/liteai-rpi/root/var/lib/liteai/models \
                     -name '*.gguf' 2>/dev/null | head -1 || true)
          if [ -n "$src" ]; then
            mkdir -p model-cache
            sudo cp "$src" model-cache/
            sudo chown -R "$(id -u):$(id -g)" model-cache
          fi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### Raspberry Pi image"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.img.xz; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-raspberrypi
          path: out/*.img.xz
          retention-days: 14
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-raspberrypi-metadata
          path: |
            out/*.sha256
            out/*.packages.txt
          retention-days: 14

  release:
    name: Publish release
    needs: [version, x86_64, raspberrypi]
    # Only tags publish, and only when both images actually built.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # Metadata only (checksums + package manifests). The images
          # themselves are over the 2 GiB release-asset limit by design, stay
          # workflow artifacts, and are linked from the release notes.
          pattern: LiteAI-*-metadata
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ls -lh artifacts

          # A previous attempt at this tag may have created the release before
          # failing on an asset upload; start clean rather than fight the
          # already_exists error. The tag itself is left alone.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          cat > release-notes.md <<EOF
          A minimal Arch Linux system that boots straight into **pi**, the coding
          agent, running on a local Qwen2.5-Coder model served by llama.cpp. No
          desktop, no GUI: the terminal is the computer.

          | Image | For |
          | --- | --- |
          | \`LiteAI-${VERSION}-x86_64.iso\` | PCs - UEFI (x64 and ia32) and legacy BIOS |
          | \`LiteAI-${VERSION}-aarch64-rpi.img.xz\` | 64-bit Raspberry Pi - Pi 5, 4, 400, CM4, 3 and Zero 2 W |

          ## Downloads

          Both images are larger than GitHub's 2 GiB release-asset limit (the
          baked model is the point), so they attach to the build workflow
          instead of this release:

          **Download them from the build run: ${RUN_URL}**

          The \`.sha256\` and \`.packages.txt\` files attached below verify what
          that run produced.

          ## PCs

          The ISO is a hybrid image: the same file boots from a USB stick or a
          burned CD/DVD.

          \`\`\`bash
          sudo dd if=LiteAI-${VERSION}-x86_64.iso of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          Boot it and pi comes up on its own against the local model; nothing
          touches the disk until you run \`sudo liteai-install\`.

          ## Raspberry Pi

          A Pi cannot boot an ISO - its firmware reads a FAT partition directly -
          so this is a flashable disk image. Write it to an SD card or USB drive
          with [Raspberry Pi Imager](https://www.raspberrypi.com/software/)
          ("Use custom" -> select the .img.xz), or:

          \`\`\`bash
          xz -dc LiteAI-${VERSION}-aarch64-rpi.img.xz | sudo dd of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          There is no installer: the flashed card **is** the system, and the root
          filesystem expands to fill it on first boot. The image unpacks to
          8 GiB, so use a 16 GB card or larger. The default login is
          \`liteai\` / \`liteai\` - change it with \`passwd\`.

          On 1-2 GB boards the baked 1.5B model is about all the RAM there is;
          a Pi 5 or an 8 GB Pi 4 gives the best experience.

          ## What is inside

          llama.cpp (prebuilt upstream binary), pi (\`@earendil-works/pi-coding-agent\`),
          the baked \`qwen2.5-coder-1.5b-instruct-q4_k_m\` model, and the LiteAI
          MCP server that lets pi manage llama.cpp, its models, itself and the
          machine. Both images are built from the current Arch Linux (and Arch
          Linux ARM) repositories on the day they are built; the \`.packages.txt\`
          file beside each image lists exactly what that build shipped.

          ## Verifying a download

          \`\`\`bash
          sha256sum -c LiteAI-${VERSION}-x86_64.iso.sha256
          sha256sum -c LiteAI-${VERSION}-aarch64-rpi.img.xz.sha256
          \`\`\`
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LiteAI ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/*
