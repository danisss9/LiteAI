name: Build images

# Tagging the repository builds both images and publishes them as one GitHub
# release:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
#   * LiteAI-<version>-x86_64.iso         - PCs (UEFI x64/ia32 and legacy BIOS)
#   * LiteAI-<version>-x86_64-cuda.iso    - PCs with an NVIDIA Turing-or-newer GPU
#   * LiteAI-<version>-aarch64-rpi.img.xz - 64-bit Raspberry Pi boards
#
# The workflow can also be run by hand from the Actions tab, which uploads the
# images as build artifacts without touching releases.
#
# The baked model puts the images at GitHub's 2 GiB release-asset limit: the
# standard x86_64 and RPi images are trimmed to just under it, but the CUDA
# ISO (NVIDIA driver + CUDA llama.cpp on top) is not. It always travels as a
# workflow artifact (downloadable from the run page for 14 days; raise
# retention or mirror them externally as needed), and the release job links
# to it instead of attaching it.
#
# Pull requests run the `mcp` job and nothing else. It takes a couple of
# minutes and is the only part of a build that can fail on a code mistake
# rather than on a mirror or a runner; the image jobs are two-hour builds
# that produce gigabyte artifacts, and gating every PR on those would buy
# very little.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which images to build'
        type: choice
        options: [all, both, x86_64, x86_64-cuda, raspberrypi]
        default: both
      pi_version:
        description: 'pi version to bundle ("pinned" uses the version in scripts/fetch-pi.sh)'
        required: false
        default: 'pinned'

permissions:
  contents: write

concurrency:
  group: build-images-${{ github.ref }}
  # A superseded PR check is wasted minutes, but a release build must never be
  # cancelled out from under a tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    # Nothing a pull request runs needs a version, and a check that only ever
    # echoes one is noise on the PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pi_version: ${{ steps.v.outputs.pi_version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date +%Y.%m.%d)-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.pi_version || 'pinned' }}" == "pinned" ]]; then
            echo "pi_version=" >> "$GITHUB_OUTPUT"   # empty: fetch-pi.sh uses its pin
          else
            echo "pi_version=${{ github.event.inputs.pi_version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building LiteAI ${version}"

  # The MCP server is architecture-neutral JavaScript, so it is built and tested
  # once and both image jobs consume the same artifact. Building it inside each
  # image job would mean two Node toolchains - pacman's in an Arch container,
  # and setup-node's on an arm64 Ubuntu runner - producing the same bytes twice.
  mcp:
    name: Build LiteAI MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci --prefix mcp --no-audit --no-fund

      - name: Typecheck
        run: npm run --prefix mcp typecheck

      - name: Test
        run: npm test --prefix mcp

      - name: Build
        run: ./scripts/build-mcp.sh -o out/mcp

      - uses: actions/upload-artifact@v7
        with:
          name: liteai-mcp-server
          path: out/mcp
          retention-days: 14

  x86_64:
    name: x86-64 ISO
    needs: [version, mcp]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || contains(fromJSON('["both","x86_64","all"]'), github.event.inputs.targets))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt MCP server
        uses: actions/download-artifact@v8
        with:
          name: liteai-mcp-server
          path: mcp-dist

      - name: Cache the baked model
        uses: actions/cache@v4
        with:
          # Keyed on the pinned file name; bump the key when fetch-model.sh's
          # model changes. The cache lives on the roomy system drive.
          path: model-cache
          key: liteai-model-${{ hashFiles('scripts/fetch-model.sh') }}-v1

      - name: Free up disk space
        run: |
          echo "before:"; df -h / /mnt | tail -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          # The build tree (pacstrap root + squashfs) goes on /mnt, the roomy
          # ephemeral disk; only the finished ISO lands on /.
          sudo mkdir -p /mnt/liteai-work
          sudo chmod 0777 /mnt/liteai-work
          echo "after:"; df -h / /mnt | tail -2

      - name: Build the ISO
        # mkarchiso builds a chroot and mounts API filesystems inside it, which
        # a plain `container:` job cannot do - hence a privileged container
        # started by hand.
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PI_VERSION: ${{ needs.version.outputs.pi_version }}
        run: |
          # Only point the build at the cached model when it is actually there;
          # fetch-model.sh refuses a configured-but-missing source, and a cold
          # cache must mean a download, not a failed run.
          model_env=()
          if [[ -f model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf ]]; then
            echo "using the cached model"
            model_env=(-e LITEAI_MODEL_SRC=/build/model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf)
          fi
          # --pull always: the runner may already hold an archlinux:latest layer
          # from its image cache, and pacstrap installs from whatever package
          # databases this container syncs - so a stale base means a stale ISO.
          docker run --rm --privileged --pull always \
            -v "${PWD}:/build" \
            -v /mnt/liteai-work:/work \
            -w /build \
            -e ISO_VERSION="${BUILD_VERSION}" \
            -e LITEAI_PI_VERSION="${PI_VERSION}" \
            -e LITEAI_MCP_PREBUILT=/build/mcp-dist \
            "${model_env[@]}" \
            archlinux:latest \
            bash -euo pipefail -c '
              # The keyring goes first and on its own: a base image older than
              # the current signing keys cannot verify the upgrade that follows.
              pacman -Sy --noconfirm --needed archlinux-keyring
              # A full upgrade, not just -S: mkarchiso pacstraps from the
              # databases this container syncs, so refreshing them here is what
              # puts current package versions into the image. grub is only an
              # optional dependency of archiso, but mkarchiso needs
              # grub-mkstandalone to build the UEFI boot modes.
              pacman -Syu --noconfirm --needed archiso git grub nodejs npm
              git config --global --add safe.directory /build
              ./scripts/build-iso.sh -v "${ISO_VERSION}" -w /work -o /build/out
            '

      - name: Keep a copy of the model for the cache
        if: always()
        run: |
          # The staged model came out of the cache (or the network once); leave
          # a copy where the cache step above can pick it up next run. The work
          # volume is a host path (/mnt/liteai-work), root-owned by the docker
          # build.
          src=$(sudo find /mnt/liteai-work/profile/airootfs/var/lib/liteai/models \
                     -name '*.gguf' 2>/dev/null | head -1 || true)
          if [ -n "$src" ]; then
            mkdir -p model-cache
            sudo cp "$src" model-cache/
            sudo chown -R "$(id -u):$(id -g)" model-cache
          fi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### x86-64 ISO"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.iso; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            # Arch is a rolling release, so what shipped is decided by the
            # mirrors at build time - print it rather than leave it to trust.
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The baked model puts the ISO past GitHub's 2 GiB release-asset limit on
      # purpose. Nothing fails: the image travels as a workflow artifact and the
      # release notes point at it (see the release job).
      # The image travels as a workflow artifact too (handy without signing in
      # to a release), but the release job attaches it to the release itself -
      # the size guard below keeps it under GitHub's 2 GiB per-file limit.
      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64
          path: out/*.iso
          retention-days: 14
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64-metadata
          path: |
            out/*.sha256
            out/*.packages.txt
          retention-days: 14

      # A release asset over 2 GiB is rejected by the uploads API with an HTTP
      # 422 - which used to surface in the release job after both images had
      # built. Failing here instead costs minutes and names the knob.
      - name: Check the ISO fits a release asset
        run: |
          limit=$((2 * 1024 * 1024 * 1024))
          for f in out/*.iso; do
            size=$(stat -c%s "$f")
            printf '%s: %s bytes (limit %s)\n' "$(basename "$f")" "$size" "$limit"
            if (( size >= limit )); then
              echo "::error::$(basename "$f") is $((size / 1048576)) MiB; GitHub rejects release assets of 2 GiB or more. Trim archiso/packages.x86_64 (firmware subpackages are the usual lever)."
              exit 1
            fi
          done

  x86_64-cuda:
    name: x86-64 CUDA ISO
    needs: [version, mcp]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || contains(fromJSON('["x86_64-cuda","all"]'), github.event.inputs.targets))
    runs-on: ubuntu-latest
    # The CUDA toolkit install plus a seven-architecture llama.cpp compile on
    # top of the standard ISO build.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt MCP server
        uses: actions/download-artifact@v8
        with:
          name: liteai-mcp-server
          path: mcp-dist

      - name: Cache the baked model
        uses: actions/cache@v4
        with:
          path: model-cache
          key: liteai-model-${{ hashFiles('scripts/fetch-model.sh') }}-v1

      - name: Free up disk space
        run: |
          echo "before:"; df -h / /mnt | tail -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          # The build tree (pacstrap root + squashfs) goes on /mnt, the roomy
          # ephemeral disk; only the finished ISO lands on /.
          sudo mkdir -p /mnt/liteai-work
          sudo chmod 0777 /mnt/liteai-work
          echo "after:"; df -h / /mnt | tail -2

      - name: Build the ISO
        # Same privileged container as the standard ISO; the CUDA script
        # installs the toolkit into it (and removes it again) itself.
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PI_VERSION: ${{ needs.version.outputs.pi_version }}
        run: |
          # Only point the build at the cached model when it is actually
          # there; fetch-model.sh refuses a configured-but-missing source.
          model_env=()
          if [[ -f model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf ]]; then
            echo "using the cached model"
            model_env=(-e LITEAI_MODEL_SRC=/build/model-cache/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf)
          fi
          docker run --rm --privileged --pull always \
            -v "${PWD}:/build" \
            -v /mnt/liteai-work:/work \
            -w /build \
            -e ISO_VERSION="${BUILD_VERSION}" \
            -e LITEAI_PI_VERSION="${PI_VERSION}" \
            -e LITEAI_MCP_PREBUILT=/build/mcp-dist \
            "${model_env[@]}" \
            archlinux:latest \
            bash -euo pipefail -c '
              # The keyring goes first and on its own: a base image older
              # than the current signing keys cannot verify what follows.
              pacman -Sy --noconfirm --needed archlinux-keyring
              pacman -Syu --noconfirm --needed archiso git grub nodejs npm
              git config --global --add safe.directory /build
              ./scripts/build-iso.sh --variant cuda -v "${ISO_VERSION}" -w /work -o /build/out
            '

      - name: Keep a copy of the model for the cache
        if: always()
        run: |
          src=$(sudo find /mnt/liteai-work/profile/airootfs/var/lib/liteai/models \
                     -name '*.gguf' 2>/dev/null | head -1 || true)
          if [ -n "$src" ]; then
            mkdir -p model-cache
            sudo cp "$src" model-cache/
            sudo chown -R "$(id -u):$(id -g)" model-cache
          fi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### x86-64 CUDA ISO"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.iso; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64-cuda
          path: out/*.iso
          retention-days: 14
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-x86_64-cuda-metadata
          path: |
            out/*.sha256
            out/*.packages.txt
          retention-days: 14

      - name: Check the ISO size is sane
        run: |
          # The CUDA ISO intentionally exceeds GitHub's 2 GiB release-asset
          # limit (driver + CUDA runtime + kernels on top of the baked
          # model); it ships as a workflow artifact and the release job
          # links to it. 4 GiB is a sanity cap, not a product requirement: a
          # build past it means something stopped being trimmed.
          limit=$((4 * 1024 * 1024 * 1024))
          for f in out/*.iso; do
            size=$(stat -c%s "$f")
            printf '%s: %s bytes (sanity cap %s)\n' "$(basename "$f")" "$size" "$limit"
            if (( size >= limit )); then
              echo "::error::$(basename "$f") is $((size / 1048576)) MiB - over the 4 GiB sanity cap. Check the nvidia-utils trim and the firmware package list."
              exit 1
            fi
          done

  raspberrypi:
    name: Raspberry Pi image
    needs: [version, mcp]
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || contains(fromJSON('["both","raspberrypi","all"]'), github.event.inputs.targets))
    # A native aarch64 runner means the build can chroot into the image
    # directly instead of emulating every command through qemu.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt MCP server
        uses: actions/download-artifact@v8
        with:
          name: liteai-mcp-server
          path: mcp-dist

      - name: Cache the baked model
        uses: actions/cache@v4
        with:
          path: model-cache
          key: liteai-model-${{ hashFiles('scripts/fetch-model.sh') }}-v1

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libarchive-tools dosfstools e2fsprogs xz-utils util-linux curl
          echo "before:"; df -h / | tail -1

      - name: Build the image
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          PI_VERSION: ${{ needs.version.outputs.pi_version }}
          LITEAI_MCP_PREBUILT: ${{ github.workspace }}/mcp-dist
        run: sudo -E ./rpi/build-image.sh -v "${BUILD_VERSION}" -o "${PWD}/out" -w /mnt/liteai-rpi

      - name: Keep a copy of the model for the cache
        if: always()
        run: |
          # The image build (-w /mnt/liteai-rpi) leaves its staged rootfs root-
          # owned; copy the model out with sudo so the cache step can keep it.
          src=$(sudo find /mnt/liteai-rpi/root/var/lib/liteai/models \
                     -name '*.gguf' 2>/dev/null | head -1 || true)
          if [ -n "$src" ]; then
            mkdir -p model-cache
            sudo cp "$src" model-cache/
            sudo chown -R "$(id -u):$(id -g)" model-cache
          fi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### Raspberry Pi image"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.img.xz; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-raspberrypi
          path: out/*.img.xz
          retention-days: 14
          compression-level: 0

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: LiteAI-${{ needs.version.outputs.version }}-raspberrypi-metadata
          path: |
            out/*.sha256
            out/*.packages.txt
          retention-days: 14

  release:
    name: Publish release
    needs: [version, x86_64, raspberrypi]
    # Only tags publish, and only when both images actually built.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # The images (the standard ones guarded to stay under the 2 GiB
          # per-file release-asset limit; the CUDA ISO is set aside below)
          # plus the checksums and manifests. The lowercase-named mcp
          # artifact does not match this pattern.
          pattern: LiteAI-*
          path: artifacts
          merge-multiple: true

      - name: Set aside the oversized CUDA ISO
        id: cuda_iso
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # GitHub rejects release assets of 2 GiB or more (HTTP 422 at
          # upload time), and the CUDA ISO - driver, CUDA llama.cpp and the
          # baked model on top of the standard image - is expected to exceed
          # that. Park it outside the artifacts directory so the publish
          # step cannot pick it up; the notes point at the workflow
          # artifacts instead.
          iso="artifacts/LiteAI-${VERSION}-x86_64-cuda.iso"
          limit=$((2 * 1024 * 1024 * 1024))
          if [[ -f "${iso}" ]] && (( $(stat -c%s "${iso}") >= limit )); then
            mkdir -p too-big
            mv "${iso}" too-big/
            rm -f "artifacts/LiteAI-${VERSION}-x86_64-cuda.iso.sha256"
            echo "state=too-big" >> "$GITHUB_OUTPUT"
          elif [[ -f "${iso}" ]]; then
            echo "state=attach" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -lh artifacts

          # A previous attempt at this tag may have created the release before
          # failing on an asset upload; start clean rather than fight the
          # already_exists error. The tag itself is left alone.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          fi

          # The CUDA variant gets a table row when it fits a release asset,
          # and a pointer at the workflow artifacts when it does not.
          table='| Download | For |
          | --- | --- |
          | `LiteAI-'"${VERSION}"'-x86_64.iso` | PCs - UEFI (x64 and ia32) and legacy BIOS |
          | `LiteAI-'"${VERSION}"'-aarch64-rpi.img.xz` | 64-bit Raspberry Pi - Pi 5, 4, 400, CM4, 3 and Zero 2 W |'
          cuda_note=""
          case "${{ steps.cuda_iso.outputs.state }}" in
            attach)
              table="${table}
          | `LiteAI-'"${VERSION}"'-x86_64-cuda.iso` | PCs with an NVIDIA Turing (2016) or newer GPU - llama.cpp compiled for CUDA |"
              ;;
            *)
              cuda_note="The CUDA variant of the PC image (NVIDIA Turing or newer, llama.cpp compiled for CUDA with GPU offload enabled by default) did not attach to this release - either it did not build, or, as usual, it was too large for a release asset. Download \`LiteAI-${VERSION}-x86_64-cuda.iso\` from the artifacts of the workflow run that produced this release (Actions -> Build images -> this run)."
              ;;
          esac

          cat > release-notes.md <<EOF
          A minimal Arch Linux system that boots straight into **pi**, the coding
          agent, running on a local Qwen2.5-Coder model served by llama.cpp. No
          desktop, no GUI: the terminal is the computer.

          ${table}

          The images carry the baked model and stay just under GitHub's 2 GiB
          per-file release-asset limit; the \`.sha256\` files verify them.

          ${cuda_note}

          ## PCs

          The ISO is a hybrid image: the same file boots from a USB stick or a
          burned CD/DVD.

          \`\`\`bash
          sha256sum -c LiteAI-${VERSION}-x86_64.iso.sha256
          sudo dd if=LiteAI-${VERSION}-x86_64.iso of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          Boot it and pi comes up on its own against the local model; nothing
          touches the disk until you run \`sudo liteai-install\`.

          ## Raspberry Pi

          A Pi cannot boot an ISO - its firmware reads a FAT partition directly -
          so this is a flashable disk image. Write it to an SD card or USB drive
          with [Raspberry Pi Imager](https://www.raspberrypi.com/software/)
          ("Use custom" -> select the .img.xz), or:

          \`\`\`bash
          sha256sum -c LiteAI-${VERSION}-aarch64-rpi.img.xz.sha256
          xz -dc LiteAI-${VERSION}-aarch64-rpi.img.xz | sudo dd of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          There is no installer: the flashed card **is** the system, and the root
          filesystem expands to fill it on first boot. The image unpacks to
          8 GiB, so use a 16 GB card or larger. The default login is
          \`liteai\` / \`liteai\` - change it with \`passwd\`.

          On 1-2 GB boards the baked 1.5B model is about all the RAM there is;
          a Pi 5 or an 8 GB Pi 4 gives the best experience.

          ## What is inside

          llama.cpp (prebuilt upstream CPU binary; the CUDA ISO builds the
          same pin from source with CUDA enabled), pi
          (\`@earendil-works/pi-coding-agent\`),
          the baked \`qwen2.5-coder-1.5b-instruct-q4_k_m\` model, and the LiteAI
          MCP server that lets pi manage llama.cpp, its models, itself and the
