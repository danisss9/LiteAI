# The CUDA llama.cpp build in /opt/llama.cpp bundles its cuBLAS runtime in
# lib/, off the default loader path. DT_RUNPATH on the binaries covers the
# direct dependencies; this entry covers the transitive ones (cuBLASLt ->
# nvJitLink), which DT_RUNPATH deliberately does not. The loader cache is
# regenerated by pacstrap's glibc hook, after the profile overlay - and
# therefore this file - is already in place.
/opt/llama.cpp/lib
