# LiteAI model server configuration.
#
# Read by liteai-llama.service. Change it with
#
#     pkexec liteai-llama set KEY VALUE
#
# (or the mcp__liteai__llama_config tool, which does the same), so the service
# is restarted after the edit. The keys are a fixed set; anything else is
# rejected by the helper.
#
# MODEL       the .gguf file in /var/lib/liteai/models/ that gets served
# ALIAS       the model id llama-server advertises; pi's ~/.pi/agent/models.json
#             must list a model with the same id
# CTX         context size in tokens; RAM use grows with it
# THREADS     CPU threads, 0 = automatic
# EXTRA_ARGS  extra llama-server flags; never put secrets here, the file is
#             world-readable, and --host/--port cannot be overridden anyway
#             (the unit pins them after EXTRA_ARGS)

MODEL=qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
ALIAS=qwen2.5-coder-1.5b
CTX=8192
THREADS=0
EXTRA_ARGS=
